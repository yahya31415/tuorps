# Tuorps stack. Production-safe base: only the API is published, and only on
# loopback (put a TLS-terminating proxy in front). Datastores sit on an
# internal network with no route out. Local tooling ports: compose.dev.yaml.
name: tuorps

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

x-app: &app
  <<: *hardened
  image: tuorps-api:${TUORPS_TAG:-dev}
  environment: &app-env
    TUORPS_ENV: ${TUORPS_ENV:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL_FILE: /run/secrets/database_url
    REDIS_URL_FILE: /run/secrets/redis_url
    ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
    ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-k1}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    HTTP_ADDR: ":8080"
    WORKER_HEALTH_ADDR: ":8081"
    # Platform integrations (optional; docs/deployment.md "Platform apps").
    # A platform is enabled only by its complete set; point each *_FILE at
    # /run/secrets/<name> once secrets/<name> holds the real value.
    META_APP_ID: ${META_APP_ID:-}
    META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
    META_APP_SECRET_FILE: ${META_APP_SECRET_FILE:-}
    META_WEBHOOK_VERIFY_TOKEN_FILE: ${META_WEBHOOK_VERIFY_TOKEN_FILE:-}
    INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
    INSTAGRAM_APP_SECRET_FILE: ${INSTAGRAM_APP_SECRET_FILE:-}
    INSTAGRAM_WEBHOOK_VERIFY_TOKEN_FILE: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN_FILE:-}
    LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
    LINKEDIN_CLIENT_SECRET_FILE: ${LINKEDIN_CLIENT_SECRET_FILE:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-}
    OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
  secrets: [database_url, redis_url, encryption_keys, meta_app_secret, meta_webhook_verify_token,
    instagram_app_secret, instagram_webhook_verify_token, linkedin_client_secret, google_client_secret]
  networks: [backend, egress]
  depends_on:
    migrate: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    <<: *hardened
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    shm_size: 256m
    environment:
      POSTGRES_DB: tuorps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TUORPS_APP_PASSWORD_FILE: /run/secrets/pg_app_password
      TUORPS_MIGRATOR_PASSWORD_FILE: /run/secrets/pg_migrator_password
    secrets: [postgres_password, pg_app_password, pg_migrator_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tuorps"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardened
    image: redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    user: redis
    command: ["redis-server", "--aclfile", "/run/secrets/redis_acl", "--appendonly", "yes", "--dir", "/data"]
    secrets: [redis_acl]
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      # The "healthcheck" ACL user may run PING and nothing else.
      test: ["CMD", "redis-cli", "--no-auth-warning", "--user", "healthcheck", "--pass", "x", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    <<: *hardened
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    # Scratch image: the volumes are root-owned, so it runs as uid 0 with no capabilities.
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    secrets: [garage_rpc_secret, garage_admin_token]
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *hardened
    image: tuorps-api:${TUORPS_TAG:-dev}
    build: { context: ., args: { CMD: api } }
    command: ["migrate", "up"]
    restart: "no"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets: [migrate_database_url]
    networks: [backend]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    build: { context: ., args: { CMD: api } }
    command: ["serve"]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "/app/tuorps", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    image: tuorps-worker:${TUORPS_TAG:-dev}
    environment:
      <<: *app-env
      # Outgoing email (provider-agnostic SMTP; see docs/deployment.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      # Set to /run/secrets/smtp_password once secrets/smtp_password holds the
      # provider's SMTP password (unset: no SMTP authentication).
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      MAIL_FROM: ${MAIL_FROM:-}
    secrets: [database_url, redis_url, encryption_keys, meta_app_secret, meta_webhook_verify_token,
      instagram_app_secret, instagram_webhook_verify_token, linkedin_client_secret, google_client_secret, smtp_password]
    build: { context: ., args: { CMD: worker } }
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/app/tuorps", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  backend:
    internal: true # no route to the internet
  egress: {}       # api/worker reach platform APIs (Meta, LinkedIn, Google)

volumes:
  pgdata: {}
  redisdata: {}
  garagemeta: {}
  garagedata: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  pg_app_password: { file: ./secrets/pg_app_password }
  pg_migrator_password: { file: ./secrets/pg_migrator_password }
  database_url: { file: ./secrets/database_url }
  migrate_database_url: { file: ./secrets/migrate_database_url }
  redis_url: { file: ./secrets/redis_url }
  redis_acl: { file: ./secrets/redis_acl }
  garage_rpc_secret: { file: ./secrets/garage_rpc_secret }
  garage_admin_token: { file: ./secrets/garage_admin_token }
  encryption_keys: { file: ./secrets/encryption_keys }
  smtp_password: { file: ./secrets/smtp_password }
  meta_app_secret: { file: ./secrets/meta_app_secret }
  meta_webhook_verify_token: { file: ./secrets/meta_webhook_verify_token }
  instagram_app_secret: { file: ./secrets/instagram_app_secret }
  instagram_webhook_verify_token: { file: ./secrets/instagram_webhook_verify_token }
  linkedin_client_secret: { file: ./secrets/linkedin_client_secret }
  google_client_secret: { file: ./secrets/google_client_secret }
