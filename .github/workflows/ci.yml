name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: "**/go.sum" }
      - run: make fmt-check vet sqlc-check staticcheck

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: "**/go.sum" }
      - run: make gosec vuln

  test:
    # Integration tests start Postgres 18 and Redis 8 via testcontainers on the runner's Docker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: "**/go.sum" }
      - run: make test cover-gate
      - run: go tool cover -func=coverage.out | tail -n 1

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: "**/go.sum" }
      - run: make fuzz-smoke FUZZTIME=10s

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make images
      - name: Images run as non-root with no shell
        run: |
          for img in tuorps-api:dev tuorps-worker:dev; do
            test "$(docker inspect -f '{{.Config.User}}' "$img")" = "nonroot:nonroot"
            if docker run --rm --entrypoint /bin/sh "$img" -c true 2>/dev/null; then echo "$img has a shell"; exit 1; fi
          done

  guard-macos:
    # The TDD guard must work on developer Macs: BSD userland, /bin/bash 3.2.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: "**/go.sum" }
      - run: command -v jq || brew install jq
      - run: /bin/bash --version | head -n 1
      - run: go test -count=1 ./scripts/...
        env:
          TDD_SCRIPT_SHELL: /bin/bash

  stack-smoke:
    # Brings the real Compose stack up on a normal Docker host, first in the
    # production configuration (compose.yaml only: datastores isolated and
    # unpublished), then with the dev overlay (ports published on loopback).
    runs-on: ubuntu-24.04
    env:
      # Production config needs SMTP settings; nothing is sent during the smoke test.
      SMTP_HOST: smtp.example.invalid
      MAIL_FROM: Tuorps CI <no-reply@tuorps.example>
      PROD: docker compose -f compose.yaml
      DEV: docker compose -f compose.yaml -f compose.dev.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make dev-secrets
      - name: Production config up
        run: $PROD up -d --build --wait
      - run: COMPOSE="$PROD" scripts/storage-init.sh
      - name: Smoke (production config)
        run: COMPOSE="$PROD" scripts/stack-smoke.sh
      - name: Dev overlay up
        run: make up
      - name: Smoke (dev overlay)
        run: make smoke
      - name: Stack logs on failure
        if: failure()
        run: $DEV logs --no-color
      - if: always()
        run: $DEV down -v
