# Garage (S3-compatible object storage) for local development; see docs/adr/0003.
# Production uses managed S3-compatible storage in an India region (docs/deployment.md).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"
# Compose file-based secrets are bind mounts that keep host permissions (0644).
allow_world_readable_secrets = true

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
admin_token_file = "/run/secrets/garage_admin_token"
