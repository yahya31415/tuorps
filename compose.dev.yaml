# Local development overlay: exposes datastores on loopback for tooling.
# Never use in production. `make up` applies it.
#
# Trade-off: publishing a port needs a routable network, so this overlay
# attaches the datastores to `devhost`, which also gives them a route to the
# internet. Isolation holds only for compose.yaml alone; CI asserts both
# (scripts/stack-smoke.sh, job stack-smoke).
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
    networks: [backend, devhost]
  redis:
    ports: ["127.0.0.1:6379:6379"]
    networks: [backend, devhost]
  garage:
    ports: ["127.0.0.1:3900:3900"]
    networks: [backend, devhost]
  # Captures all outgoing mail; UI and API on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /data]
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [backend, devhost]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      MAIL_FROM: "Tuorps Dev <no-reply@tuorps.local>"
    depends_on:
      mailpit: { condition: service_healthy }

networks:
  devhost: {} # published ports need a non-internal network
